[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tacticore"
version = "0.1.0"
description = "低频多资产战术配置研究系统"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "plotly>=5,<7",
  "rqalpha>=5.5,<6",
  "tomli>=2,<3",
  "vectorbt>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["tacticore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["tacticore"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["rqalpha", "rqalpha.*", "vectorbt", "vectorbt.*"]
ignore_missing_imports = true

[tool.uv.extra-build-dependencies]
rqalpha = ["setuptools<81"]
